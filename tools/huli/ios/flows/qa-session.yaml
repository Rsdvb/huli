# Opens the session titled TITLE and shoots it: the conversation, its menus and sheets.
appId: io.github.rsdvb.huli
---
- runFlow: qa-reset.yaml
- tapOn: "会话"
- tapOn:
    text: ".*${TITLE}.*"
- waitForAnimationToEnd
- takeScreenshot: c01-session
- swipe:
    start: 50%, 30%
    end: 50%, 80%
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: c02-session-up
- tapOn: "文件、改动、Artifacts、终端和子会话"
- waitForAnimationToEnd
- takeScreenshot: c03-more-menu
- tapOn:
    point: 50%,90%
- waitForAnimationToEnd
- tapOn:
    point: 50%,10%
- waitForAnimationToEnd
- takeScreenshot: c04-title-menu
- tapOn:
    point: 50%,90%
- waitForAnimationToEnd
- tapOn:
    text: "权限模式.*"
- waitForAnimationToEnd
- takeScreenshot: c05-mode-menu
- tapOn:
    point: 50%,40%
- waitForAnimationToEnd
- tapOn:
    text: "模型.*"
- waitForAnimationToEnd
- takeScreenshot: c06-model-menu
- tapOn:
    point: 50%,40%
- waitForAnimationToEnd
- tapOn:
    text: "添加照片、文件或命令"
- waitForAnimationToEnd
- takeScreenshot: c07-attach-menu
- tapOn:
    point: 50%,40%
- waitForAnimationToEnd
- tapOn:
    text: "上下文已用.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: c08-context-sheet
- swipe:
    start: 50%, 40%
    end: 50%, 95%
    duration: 300
- waitForAnimationToEnd
- tapOn:
    text: ".*限额已用.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: c09-plan-usage
