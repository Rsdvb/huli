# Shoots Settings and each page it leads to, coming back by the edge swipe.
appId: io.github.rsdvb.huli
---
- runFlow: qa-reset.yaml
- tapOn: '会话'
- tapOn:
    point: 7%,10%
- waitForAnimationToEnd
- takeScreenshot: s01-settings
- swipe:
    start: 50%, 80%
    end: 50%, 30%
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: s02-settings-2
- swipe:
