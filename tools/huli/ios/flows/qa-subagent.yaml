# Opens the session titled TITLE, then its sub-agent's card titled CHILD: the read-only bar.
appId: io.github.rsdvb.huli
---
- runFlow: qa-reset.yaml
- tapOn: "会话"
- tapOn:
    text: ".*${TITLE}.*"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: ".*${CHILD}.*"
    direction: UP
- tapOn:
    text: ".*${CHILD}.*"
- waitForAnimationToEnd
- takeScreenshot: a01-subagent
- tapOn:
    text: "文件、改动、Artifacts、终端和子会话"
- waitForAnimationToEnd
- takeScreenshot: a02-subagent-more
- tapOn:
    point: 50%,50%
- waitForAnimationToEnd
- tapOn:
    text: "返回 .*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: a03-parent
