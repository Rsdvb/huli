# The Artifacts tab with the artifact titled NAME, its viewer, and selecting a document's text.
appId: io.github.rsdvb.huli
---
- runFlow: qa-reset.yaml
- tapOn: 'Artifacts'
- waitForAnimationToEnd
- takeScreenshot: r01-artifacts
- tapOn:
    text: '.*${NAME}.*'
    index: 0
- waitForAnimationToEnd
- takeScreenshot: r02-viewer
- longPressOn:
    point: 50%,40%
- waitForAnimationToEnd
- takeScreenshot: r03-doc-menu
- tapOn:
    text: '选择文本'
    optional: true
- waitForAnimationToEnd
- longPressOn:
    point: 30%,25%
- waitForAnimationToEnd
- takeScreenshot: r04-doc-select
