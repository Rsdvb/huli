# A session's MCP servers on the phone: the session's More menu opens MCP 服务器, which lists the
# servers Kite handed the fake agent, whose own states that agent does not report.
# Ends: both appearances
appId: io.github.rsdvb.huli
---
- launchApp:
    stopApp: true
    arguments:
      huliNoAsk: 'YES'
- tapOn:
    text: '允许'
    optional: true
- tapOn: '会话'
- tapOn: '新会话'
- waitForAnimationToEnd
- tapOn:
    text: '(想让|给) .*'
- inputText: '/basic-turn'
- tapOn:
    text: '选一个项目，或者直接说你要什么。'
    optional: true
- tapOn: '发送'
- extendedWaitUntil:
    visible:
      text: '给 .* 发消息 回复.*'
    timeout: 120000
- tapOn: '文件、改动、产物、终端和子会话'
- waitForAnimationToEnd
- takeScreenshot: m01-menu
- tapOn: 'MCP 服务器'
- extendedWaitUntil:
    visible:
      text: '.*纸鸢交给它的服务器.*'
    timeout: 30000
    optional: true
- takeScreenshot: m02-panel
