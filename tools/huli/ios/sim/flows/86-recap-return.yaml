# The recap of time away as the user comes and goes (the developer build's huliRecapAwayMs launch
# argument shortens the half hour to fifteen seconds). A session left while tool calls run greets
# the user, opened again, with a solid bar of what happened meanwhile, whose jump brings that to
# the top and puts the bar away. Work that goes on while the app is in the background for less
# than the threshold shows nothing on return; back after the threshold, the bar counts only what
# came while away, and closed, it goes. Of a run of tool calls every seventh is a command (30 calls
# hold 4, 12 hold 2). Maestro waits for the running turn's motion to settle before a tap, which
# would leave the session only once the work is done, so the taps that leave keep that wait short.
# Ends: both appearances
appId: io.github.rsdvb.huli
---
- launchApp:
    stopApp: true
    arguments:
      huliNoAsk: 'YES'
      huliDev: 'YES'
      huliRecapAwayMs: '15000'
- tapOn:
    text: '允许'
    optional: true
- tapOn: '会话'
- tapOn: '新会话'
- waitForAnimationToEnd
- tapOn:
    text: '(想让|给) .*'
- inputText: '/basic-turn'
- tapOn:
    text: '选一个项目，或者直接说你要什么。'
    optional: true
- tapOn: '发送'
- extendedWaitUntil:
    visible:
      text: '给 .* 发消息 回复.*'
    timeout: 120000
# 1. Left while 40 tool calls run, opened again after the threshold: the bar under the header.
- tapOn:
    text: '给 .* 发消息.*'
- inputText: '/tool-storm --count 40 --pace 400'
- tapOn:
    text: '发送'
    waitToSettleTimeoutMs: 500
- tapOn:
    text: '返回'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: 'PAUSE_NEVER'
    timeout: 18000
    optional: true
- tapOn:
    text: '.*Fix the flaky login test.*'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      text: '.*跳到离开处'
    timeout: 20000
- takeScreenshot: r01-recap
- tapOn:
    text: '.*跳到离开处'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: 'PAUSE_NEVER'
    timeout: 2500
    optional: true
- takeScreenshot: r02-jumped
- assertNotVisible:
    text: '.*跳到离开处'
# 2. Work goes on while the app is in the background for a few seconds: nothing on return.
- extendedWaitUntil:
    visible:
      text: '给 .* 发消息 回复.*'
    timeout: 90000
- tapOn:
    text: '给 .* 发消息.*'
- inputText: '/tool-storm --count 20 --pace 300'
- tapOn:
    text: '发送'
    waitToSettleTimeoutMs: 500
- pressKey: home
- extendedWaitUntil:
    visible: 'PAUSE_NEVER'
    timeout: 3000
    optional: true
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: 'PAUSE_NEVER'
    timeout: 5000
    optional: true
- takeScreenshot: r03-short-absence
- assertNotVisible:
    text: '.*跳到离开处'
# 3. Away past the threshold while 30 calls run: only those, at most 4 commands, none of the 20's.
- extendedWaitUntil:
    visible:
      text: '给 .* 发消息 回复.*'
    timeout: 90000
- tapOn:
    text: '给 .* 发消息.*'
- inputText: '/tool-storm --count 30 --pace 400'
- tapOn:
    text: '发送'
    waitToSettleTimeoutMs: 500
- pressKey: home
- extendedWaitUntil:
    visible: 'PAUSE_NEVER'
    timeout: 24000
    optional: true
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      text: '.*跳到离开处'
    timeout: 20000
- takeScreenshot: r04-long-absence
- assertVisible:
    text: '.*跑了 [1-4] 条命令.*'
    optional: true
- tapOn:
    text: '关闭离开期间的摘要'
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: 'PAUSE_NEVER'
    timeout: 1500
    optional: true
- takeScreenshot: r05-closed
- assertNotVisible:
    text: '.*跳到离开处'
# 4. Away past the threshold once more, with 12 calls: the bar left on screen.
- extendedWaitUntil:
    visible:
      text: '给 .* 发消息 回复.*'
    timeout: 90000
- tapOn:
    text: '给 .* 发消息.*'
- inputText: '/tool-storm --count 12 --pace 500'
- tapOn:
    text: '发送'
    waitToSettleTimeoutMs: 500
- pressKey: home
- extendedWaitUntil:
    visible: 'PAUSE_NEVER'
    timeout: 18000
    optional: true
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      text: '.*跳到离开处'
    timeout: 20000
- takeScreenshot: r06-again
