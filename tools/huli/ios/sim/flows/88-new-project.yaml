# Add project on the phone (Huli): Settings > 项目 > 添加项目 offers 打开文件夹, 从 Git 克隆 and
# 新建空项目. In light: the clone sheet with a refused address, then a small public repository
# cloned into a folder the computer offers, with its progress. In dark: an empty project with a
# README and a Node.js .gitignore. Each sheet ends by finishing, as a test cannot drag the
# system's sheet away reliably, and Return takes the keyboard down, as hideKeyboard may fail.
# The projects list can still move as the page settles, with the earlier flows' and the clone's
# projects above 添加项目 (once a tap meant for it opened another project's page), so 添加项目 is
# found by its whole accessibility label, brought to the middle once the list is still, and the
# menu must be open before a row of it is tapped; a tap that opened a project instead goes back
# and tries once more.
appId: io.github.rsdvb.huli
---
- launchApp:
    stopApp: true
    arguments:
      huliNoAsk: 'YES'
- tapOn:
    text: '允许'
    optional: true
- tapOn: '会话'
- tapOn: '账户与设置'
- scrollUntilVisible:
    element: '项目'
    centerElement: true
- tapOn: '项目'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'PAUSE_NEVER'
    timeout: 1500
    optional: true
- scrollUntilVisible:
    element: '添加项目'
    centerElement: true
- waitForAnimationToEnd
- tapOn: '添加项目'
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible: '从 Git 克隆….*'
    commands:
      - runFlow:
          when:
            visible: '路径.*'
          commands:
            - tapOn: '返回'
            - waitForAnimationToEnd
      - scrollUntilVisible:
          element: '添加项目'
          centerElement: true
      - waitForAnimationToEnd
      - tapOn: '添加项目'
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: '从 Git 克隆….*'
    timeout: 10000
- takeScreenshot: p01-add-menu
# A sheet's row reads as its label and its detail together.
- tapOn: '从 Git 克隆….*'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: '位置'
    timeout: 20000
- takeScreenshot: p02-clone-sheet
- tapOn:
    id: 'new-project-url'
- inputText: 'ext::sh -c id'
- waitForAnimationToEnd
- takeScreenshot: p03-clone-refused
- eraseText: 20
- inputText: 'https://github.com/octocat/Hello-World.git'
- pressKey: Enter
- waitForAnimationToEnd
- takeScreenshot: p04-clone-ready
- tapOn: '克隆'
- takeScreenshot: p05-cloning
# The project's page, once the clone is done: its 路径 row.
- extendedWaitUntil:
    visible: '路径.*'
    timeout: 120000
- waitForAnimationToEnd
- takeScreenshot: p06-cloned
# Back to Settings, into the dark theme, and to the projects again.
- tapOn: '返回'
- waitForAnimationToEnd
- tapOn: '返回'
- waitForAnimationToEnd
# Settings comes back scrolled down to 项目, below 主题.
- scrollUntilVisible:
    element: '主题'
    direction: UP
- tapOn: '主题'
- tapOn: '深色'
- waitForAnimationToEnd
- scrollUntilVisible:
    element: '项目'
    centerElement: true
- tapOn: '项目'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: 'PAUSE_NEVER'
    timeout: 1500
    optional: true
- scrollUntilVisible:
    element: '添加项目'
    centerElement: true
- waitForAnimationToEnd
- tapOn: '添加项目'
- waitForAnimationToEnd
- runFlow:
    when:
      notVisible: '新建空项目….*'
    commands:
      - runFlow:
          when:
            visible: '路径.*'
          commands:
            - tapOn: '返回'
            - waitForAnimationToEnd
      - scrollUntilVisible:
          element: '添加项目'
          centerElement: true
      - waitForAnimationToEnd
      - tapOn: '添加项目'
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: '新建空项目….*'
    timeout: 10000
- takeScreenshot: p07-add-menu-dark
- tapOn: '新建空项目….*'
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: '位置'
    timeout: 20000
- tapOn:
    id: 'new-project-name'
- inputText: 'kite-sim-demo'
- pressKey: Enter
- tapOn: 'Node.js'
- waitForAnimationToEnd
- takeScreenshot: p08-empty-ready-dark
- tapOn: '创建'
- extendedWaitUntil:
    visible: '路径.*'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: p09-created-dark
- tapOn: '返回'
- waitForAnimationToEnd
- takeScreenshot: p10-projects-dark
