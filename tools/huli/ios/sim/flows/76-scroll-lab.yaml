# The developer's scroll lab (src/dev/ScrollLab.tsx): a sideways swipe on each scroller, in each of
# the wrappers a reply's code block sits in, with a screenshot after each, to tell which wrapper
# keeps the swipe from scrolling.
appId: io.github.rsdvb.huli
---
- launchApp:
    stopApp: true
    arguments:
      huliNoAsk: 'YES'
      huliDev: 'YES'
      huliDevScroll: 'plain'
- extendedWaitUntil:
    visible: 'scroll lab plain'
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: l-plain-0
- swipe:
    from:
      id: 'p1'
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: l-plain-p1
- swipe:
    from:
      id: 'p2'
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: l-plain-p2
- swipe:
    from:
      id: 'p3'
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: l-plain-p3
- swipe:
    from:
      id: 'm4'
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: l-plain-m4
- swipe:
    from:
      id: 'm5'
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: l-plain-m5
- swipe:
    from:
      id: 'm6'
    direction: LEFT
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: l-plain-m6
