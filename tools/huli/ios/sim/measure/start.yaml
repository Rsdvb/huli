# measure.sh: a new session sent PROMPT, waiting until its screen shows, then the keyboard down.
appId: io.github.rsdvb.huli
---
- runFlow:
    file: launch.yaml
    env:
      GLASS: ${GLASS}
# The tab bar's round button on iOS; its link on Android, whose tab bar names it in no text.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: '新会话'
- runFlow:
    when:
      platform: Android
    commands:
      - openLink: huli://new
- waitForAnimationToEnd
- tapOn:
    text: '(想让|给) .*'
- inputText: ${PROMPT}
- tapOn:
    text: '选一个项目，或者直接说你要什么。'
    optional: true
- tapOn: '发送'
# The session opens once the agent has started, which on a fresh runner takes a while.
- extendedWaitUntil:
    visible:
      text: '给 .* 发消息.*'
    timeout: 120000
- hideKeyboard
- takeScreenshot: ${SHOT}
