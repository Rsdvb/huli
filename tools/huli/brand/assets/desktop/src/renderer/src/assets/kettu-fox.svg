<svg xmlns="http://www.w3.org/2000/svg" width="730" height="730" viewBox="137 170 730 730">
  <!-- Kite, dark: the kite in orange on near-black, its string falling in an S to the hand
       that holds it. Full bleed on a 1024 grid; each platform rounds or insets it. render.mjs reads
       the groups by id (ground, string, kite), so keep them. -->
  <defs>
    <linearGradient id="groundFill" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A2A2E"/>
      <stop offset="1" stop-color="#0E0E10"/>
    </linearGradient>
    <radialGradient id="groundGlow" cx="300" cy="220" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- The kite's right half, in its fold's shade: the light comes from the upper left. -->
    <clipPath id="kiteShade"><rect x="0" y="-200" width="200" height="560"/></clipPath>
  </defs>
  <g id="ground" display="none">
    <rect width="1024" height="1024" fill="url(#groundFill)"/>
    <rect width="1024" height="1024" fill="url(#groundGlow)"/>
  </g>
  <g id="string">
    <path d="M513 630 C507 680 457 731 407 745 S307 810 301 860" fill="none" stroke="#FF8A48" stroke-width="20" stroke-linecap="round"/>
    <circle cx="301" cy="860" r="30" fill="#FF8A48"/>
  </g>
  <g id="kite" transform="translate(575 340) rotate(12)" stroke-linejoin="round">
    <path d="M0 -153 L151 0 L0 297 L-151 0 Z" fill="#FF8A48" stroke="#FF8A48" stroke-width="20"/>
    <path d="M0 -153 L151 0 L0 297 L-151 0 Z" fill="#EC6B2B" stroke="#EC6B2B" stroke-width="20" clip-path="url(#kiteShade)"/>
    <!-- The spars: the spine, and the cross spar bowed by the wind. -->
    <g fill="none" stroke="#0E0E10" stroke-opacity="0.24" stroke-width="7" stroke-linecap="round">
      <path d="M0 -143 L0 285"/>
      <path d="M-141 0 Q0 -24 141 0"/>
    </g>
  </g>
</svg>
