<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">
  <!-- Kite's tray glyph, drawn for the 18 pt macOS menu bar canvas and the 16 px Windows and Linux
       trays: the icon's kite and string simplified for a few pixels, kept clear of the bottom
       right, where the tray's status dot goes. The shaded half is lighter only by opacity, so a
       template image keeps it. render.mjs fills it with any color. -->
  <defs>
    <clipPath id="trayLit"><rect x="-6" y="-6" width="6" height="16"/></clipPath>
    <clipPath id="trayShade"><rect x="0" y="-6" width="6" height="16"/></clipPath>
  </defs>
  <g id="glyph" fill="#000000">
    <path d="M8.95 13.4 C8.7 15.1 6.7 14.9 5.4 15.5 S3.4 16.4 3.1 16.5" fill="none" stroke="#000000" stroke-width="1.25" stroke-linecap="round"/>
    <circle cx="2.9" cy="16.3" r="1.4"/>
    <g transform="translate(11 5.4) rotate(14)" stroke="#000000" stroke-width="0.9" stroke-linejoin="round">
      <path d="M0 -4.5 L4.6 0 L0 8.5 L-4.6 0 Z" clip-path="url(#trayLit)"/>
      <path d="M0 -4.5 L4.6 0 L0 8.5 L-4.6 0 Z" opacity="0.55" clip-path="url(#trayShade)"/>
    </g>
  </g>
</svg>
