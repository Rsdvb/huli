name: Huli sync

# Once a day: merge Kettu's main into Huli's, check that Huli still type-checks and that Huli
# Cloud's tests pass, push, then start a build. A conflict or a failed check stops here and opens
# the sync-failure issue instead, or updates it while it is open; a sync that merges, or finds
# nothing to merge, closes it. Kettu's own workflows stay disabled in this repository, new ones
# included.
on:
  schedule:
    - cron: '23 19 * * *' # 03:23 in Beijing
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: huli-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      # gh picks a remote named upstream over origin, so after the merge step adds Kettu's it
      # aimed every issue, workflow disable and run at KettuAI/Kettu, where this token may not.
      GH_REPO: ${{ github.repository }}
    steps:
      # A token that may push changes to workflow files, which Kettu's merges can carry; without
      # one, GitHub's token is used and such a merge fails to push.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.HULI_SYNC_TOKEN || github.token }}

      - name: Merge Kettu's main
        id: merge
        run: |
          git config user.name 'huli-sync'
          git config user.email 'huli-sync@users.noreply.github.com'
          git remote add upstream https://github.com/KettuAI/Kettu.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo 'Already up to date with Kettu.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit -m "huli: merge Kettu $(git rev-parse --short upstream/main)" upstream/main; then
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo 'conflict=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Report the conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/issue.md"
          {
            echo '自动合并 KettuAI/Kettu 的 main 时有冲突，没有推送，需要手动合并。'
            echo
            echo "- 时间：$(date -u '+%F %H:%M') UTC"
            echo "- 上游：$(git rev-parse --short upstream/main)，main 落后 $(git rev-list --count HEAD..upstream/main) 个提交"
            echo "- 日志：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "有冲突的文件（$(wc -l < "$RUNNER_TEMP/conflicts.txt") 个）："
            echo
            echo '<!-- what -->'
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt"
            echo '<!-- /what -->'
            echo
            echo '手动合并：在 huli-repo 里 `git fetch upstream`，从 main 开一个分支 `git merge upstream/main`，按 tools/huli/README.md 的规矩解决冲突、跑完检查再合进 main。合进 main 后，下一次同步会自动关掉这个议题。'
          } > "$body"
          bash tools/huli/sync-issue.sh report "$body"
          exit 1

      - uses: pnpm/action-setup@v6
        if: steps.merge.outputs.changed == 'true'
      - uses: actions/setup-node@v7
        if: steps.merge.outputs.changed == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Check
        if: steps.merge.outputs.changed == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm exec tsc -p cloud/tsconfig.json
          pnpm exec vitest run cloud/test

      # The phone app runs Kettu's shared protocol code, so an upstream change can break it without
      # touching a line of it: it must still type-check and bundle before the merge is pushed.
      - name: Check the phone app
        if: steps.merge.outputs.changed == 'true'
        working-directory: mobile
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npx tsc --noEmit
          npx expo export --platform ios --output-dir "$RUNNER_TEMP/expo-ios" > /dev/null
          npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-android" > /dev/null

      - name: Report a failed check
        if: failure() && steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/issue.md"
          {
            echo '合并 KettuAI/Kettu 的 main 没有冲突，但合并后的检查没通过，所以没有推送。'
            echo
            echo "- 时间：$(date -u '+%F %H:%M') UTC"
            echo "- 上游：$(git rev-parse --short upstream/main)"
            echo "- 日志：$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '<!-- what -->'
            echo '没通过的是类型检查、Huli Cloud 测试或手机端检查之一，见日志。'
            echo '<!-- /what -->'
          } > "$body"
          bash tools/huli/sync-issue.sh report "$body"

      - name: Push
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main

      # Up to date counts too: a merge made by hand ends the failure the issue reports.
      - name: Close the failure issue
        if: success() && steps.merge.outputs.conflict != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/huli/sync-issue.sh close \
            "同步恢复正常：main 已包含上游 $(git rev-parse --short upstream/main)（$(date -u +%F)）。"

      - name: Keep Kettu's own workflows disabled
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in .github/workflows/*.yml; do
            name="$(basename "$file")"
            case "$name" in
              huli-*) ;;
              *) gh workflow disable "$name" 2>/dev/null || true ;;
            esac
          done

      - name: Build
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run huli-build.yml --ref main
