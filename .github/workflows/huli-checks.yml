name: Huli checks

# Every push, to main or any branch, and every pull request from a fork: what the release run would
# fail on, checked before a merge rather than after it, on Linux. The `changes` job picks the jobs
# from the files changed: the desktop app's types and tests, Huli Cloud's types, tests and bundle as
# the release builds it, the phone app's types and its iOS and Android bundles from its own fresh
# install alone, as the release's phone jobs check and bundle them, and lint and formatting for
# every change. A change to docs alone runs nothing. Kettu's own ci.yml stays disabled in this
# repository (huli-sync.yml keeps it so); this one runs instead, so a sync never has to change it.
on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md', 'LICENSE', 'LICENSE-EXCEPTION']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**/*.md', 'LICENSE', 'LICENSE-EXCEPTION']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huli-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    # A pull request from a branch of this repository was checked on its push already.
    if: >-
      !github.event.pull_request.draft && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-24.04
    outputs:
      desktop: ${{ steps.diff.outputs.desktop }}
      cloud: ${{ steps.diff.outputs.cloud }}
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          all() {
            echo "$1; checking everything."
            printf '%s\n' desktop=true cloud=true mobile=true >> "$GITHUB_OUTPUT"
            exit 0
          }
          # A branch is compared with main, so every push to it checks all it changes; main with
          # what the push brought.
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push)
              if [ "$REF" != refs/heads/main ]; then
                range="main...$SHA"
              elif [ -z "${BEFORE//0/}" ]; then
                all 'A new main'
              else
                range="$BEFORE...$SHA"
              fi
              ;;
            *) all "Started by $EVENT" ;;
          esac
          # The comparison lists 300 files at most; a longer one is taken as touching everything.
          if ! files="$(gh api "repos/$GH_REPO/compare/$range" --jq '.files[].filename')"; then
            all "No comparison for $range"
          fi
          count="$(grep -c . <<< "$files" || true)"
          [ "$count" -ge 300 ] && all "$count files changed"
          echo "$count files changed in $range:"
          sed 's/^/  /' <<< "$files"
          code="$(grep -Ev '\.md$|^LICENSE(-EXCEPTION)?$' <<< "$files" || true)"
          has() { grep -Eq "$1" <<< "$code" && echo true || echo false; }
          # The desktop app's checks read the whole tree but the phone app's, Huli Cloud's and the
          # other workflows; this workflow's own changes run every job.
          self='^\.github/workflows/huli-checks\.yml$'
          outside="$(grep -Ev '^(mobile/|cloud/|vite\.cloud\.config\.mts$|\.github/)' <<< "$code" || true)"
          # What Huli Cloud's install, config and tests read beside cloud/.
          cloud='^(cloud/|vite\.cloud\.config\.mts$|vitest\.config\.mts$|src/shared/|tools/build/|patches/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'
          {
            echo "desktop=$([ -n "$outside" ] && echo true || has "$self")"
            echo "cloud=$(has "$cloud|$self")"
            echo "mobile=$(has "^(mobile/|src/shared/)|$self")"
          } | tee -a "$GITHUB_OUTPUT"

  desktop:
    name: Desktop app
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Huli Cloud's tests are the cloud job's.
      - run: pnpm exec vitest run --exclude 'cloud/**'

  # As the release's Huli Cloud job checks and builds it.
  cloud:
    name: Huli Cloud
    needs: changes
    if: needs.changes.outputs.cloud == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p cloud/tsconfig.json
      - run: pnpm exec vitest run cloud/test
      - run: pnpm exec vite build -c vite.cloud.config.mts

  lint:
    name: Lint and formatting
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  # As the release's iOS and Android jobs check it: mobile/'s own packages, freshly installed, and
  # nothing of the workspace's, which a computer that ran pnpm install still resolves through.
  # tools/huli/check-like-release.mjs does the same on a computer.
  mobile:
    name: Phone app
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx tsc --noEmit
      # Metro bundles as the release's builds do, so a module the bundle cannot resolve fails here
      # rather than there. Expo reads Metro's cache from the restore folder and writes only what this
      # bundle used to the output one, which is kept for the next run in its place.
      - name: Restore Metro's cache
        id: metro
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/metro-cache
          key: metro-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            metro-${{ runner.os }}-${{ hashFiles('mobile/package-lock.json') }}-
            metro-${{ runner.os }}-
      - name: Bundle for iOS and Android
        env:
          EXPO_METRO_CACHE_RESTORE_DIR: ${{ runner.temp }}/metro-cache
          EXPO_METRO_CACHE_OUTPUT_DIR: ${{ runner.temp }}/metro-output
        run: |
          mkdir -p "$EXPO_METRO_CACHE_RESTORE_DIR" "$EXPO_METRO_CACHE_OUTPUT_DIR"
          npx expo export --platform ios --output-dir "$RUNNER_TEMP/expo-ios" > /dev/null
          npx expo export --platform android --output-dir "$RUNNER_TEMP/expo-android" > /dev/null
          rm -rf "$EXPO_METRO_CACHE_RESTORE_DIR"
          mv "$EXPO_METRO_CACHE_OUTPUT_DIR" "$EXPO_METRO_CACHE_RESTORE_DIR"
      - name: Keep Metro's cache
        if: steps.metro.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/metro-cache
          key: ${{ steps.metro.outputs.cache-primary-key }}
