name: Huli build

# Builds Huli for Windows, Linux, macOS, iOS and Android on GitHub's runners (macOS and iOS on the
# owner's Mac instead while the HULI_MAC_RUNNER variable is `true`, which a public repository must
# never set) and Huli Cloud's bundle; then puts them on Huli's update channel. The version is
# 0.<UTC date>.<run number>.
#
# The repository is public but its builds are not: they go only to the update channel, whose path
# comes from the HULI_UPDATE_PATH secret (tools/huli/update-path.mjs fills it into the code) and
# whose URL from HULI_CHANNEL_URL. Artifacts only carry the files from job to job, sealed with the
# HULI_ARTIFACT_KEY secret (tools/huli/seal-artifacts.mjs) so a signed-in user who downloads one
# while the run goes on gets nothing: each is kept a day at most and the cleanup job deletes them
# all once the run ends, failed or not. The release on GitHub is a tag with notes and no files.
# iOS goes to TestFlight's internal testers, and signed ad hoc to the update channel, where only
# the team's registered devices can install it.
#
# It runs by hand, after huli-sync.yml merges Kettu's main, and every night; a night's run builds
# only when main has commits the latest release lacks, and skips every job otherwise.
on:
  workflow_dispatch:
    inputs:
      # Tries the iOS signing and both exports on a branch: no other job, no TestFlight upload, no
      # artifact and no release.
      ios_dry_run:
        description: Build and export iOS only (App Store and ad hoc); upload and publish nothing
        type: boolean
        default: false
  schedule:
    - cron: '41 19 * * *' # 03:41 in Beijing, after huli-sync.yml's 03:23

permissions:
  contents: read

concurrency:
  group: huli-build
  cancel-in-progress: false

jobs:
  changes:
    name: Look for changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != schedule ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A sync that merges starts a build of the merge itself, which would follow this one.
          syncing="$(gh api "repos/$GH_REPO/actions/workflows/huli-sync.yml/runs?per_page=5" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          if [ "$syncing" != 0 ]; then
            echo 'Huli sync is still running; it starts a build if it merges.'
            exit 0
          fi
          tag="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')"
          if [ -n "$tag" ] && [ "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" = "$GITHUB_SHA" ]; then
            echo "main ($GITHUB_SHA) is released already as $tag."
            exit 0
          fi
          # A commit whose build failed is not retried every night; a run by hand retries it.
          failed="$(gh api "repos/$GH_REPO/actions/workflows/huli-build.yml/runs?head_sha=$GITHUB_SHA&status=failure&per_page=1" \
            --jq .total_count)"
          if [ "$failed" != 0 ]; then
            echo "A build of $GITHUB_SHA failed already; run this workflow by hand to retry it."
            exit 0
          fi
          echo "main ($GITHUB_SHA) has commits since ${tag:-no release yet}; building."
          echo 'build=true' >> "$GITHUB_OUTPUT"

  version:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Every job seals its files with this key; a run without it stops here, before building.
      - name: Check the artifact key
        env:
          HULI_ARTIFACT_KEY: ${{ secrets.HULI_ARTIFACT_KEY }}
        run: |
          if [ -z "$HULI_ARTIFACT_KEY" ]; then
            echo '::error::The HULI_ARTIFACT_KEY secret is not set; see tools/huli/README.md.'
            exit 1
          fi
      - id: version
        run: echo "version=0.$(date -u +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  desktop:
    name: ${{ matrix.name }}
    needs: version
    if: ${{ !inputs.ios_dry_run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: --win --x64
          - name: Linux x64
            os: ubuntu-24.04
            target: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set the version
        shell: bash
        run: npm pkg set "version=${{ needs.version.outputs.version }}"
      - name: Rebrand
        run: node tools/huli/rebrand.mjs
        env:
          HULI_UPDATE_PATH: ${{ secrets.HULI_UPDATE_PATH }}
      - name: Fetch Cua Driver
        run: node tools/install/cua-driver.mjs
      - name: Fetch mihomo
        run: node tools/install/mihomo.mjs
      - run: pnpm build
      - name: Fetch the device helpers
        run: node tools/install/device-helpers.mjs
      - name: Package
        run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Sealed before upload: the repository is public (see tools/huli/README.md).
      - name: Seal the files
        shell: bash
        env:
          HULI_ARTIFACT_KEY: ${{ secrets.HULI_ARTIFACT_KEY }}
        run: node tools/huli/seal-artifacts.mjs seal "sealed/huli-${{ matrix.os }}.sealed" 'dist/*-setup.exe' 'dist/*-setup.exe.blockmap' 'dist/*.AppImage' 'dist/latest*.yml'
      - uses: actions/upload-artifact@v7
        with:
          name: huli-${{ matrix.os }}
          retention-days: 1
          # Sealed bytes do not compress.
          compression-level: 0
          path: sealed/huli-${{ matrix.os }}.sealed
          if-no-files-found: error

  mac:
    name: macOS arm64
    needs: version
    if: ${{ !inputs.ios_dry_run }}
    # GitHub's own macOS runner, or the owner's Mac while HULI_MAC_RUNNER is `true`. The owner's
    # Mac must never serve a public repository: a pull request could run code on it.
    runs-on: ${{ vars.HULI_MAC_RUNNER == 'true' && fromJSON('["self-hosted","macOS","huli"]') || 'macos-26' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Use the newest Xcode
        if: runner.environment == 'github-hosted'
        run: bash tools/huli/newest-xcode.sh
      - name: Restore the Apple keys
        if: runner.environment == 'github-hosted'
        env:
          APPLE_KEYS: ${{ secrets.HULI_APPLE_KEYS }}
        run: bash tools/huli/restore-apple-keys.sh
      - run: pnpm install --frozen-lockfile
      - run: npm pkg set "version=${{ needs.version.outputs.version }}"
      - name: Rebrand
        run: node tools/huli/rebrand.mjs
        env:
          HULI_UPDATE_PATH: ${{ secrets.HULI_UPDATE_PATH }}
      - run: node tools/install/cua-driver.mjs
      - name: Fetch mihomo
        run: node tools/install/mihomo.mjs
      # With the Developer ID certificate kept on the Mac, the app is signed and notarized and
      # installs its updates itself, from the zip Squirrel.Mac takes; without it, it stays an
      # unsigned build whose updates link to the disk image.
      - name: Signing
        run: |
          keys="$HOME/.huli-keys"
          if [ -f "$keys/mac-developer-id.p12" ] && [ -f "$keys/mac-developer-id.pass" ]; then
            pass="$(cat "$keys/mac-developer-id.pass")"
            echo "::add-mask::$pass"
            # electron-builder 26 takes the config's empty identity as a name to look for, so the
            # certificate's own name is given instead, without the prefix it adds itself.
            identity="$(openssl x509 -in "$keys/mac-developer-id.pem" -noout -subject \
              | sed -n 's/.*CN *= *Developer ID Application: *\([^/,]*\).*/\1/p')"
            {
              echo "HULI_MAC_IDENTITY=$identity"
              echo "MAIN_VITE_UPDATE_MODE=install"
              echo "HULI_MAC_CONFIG=electron-builder.mac-signed.yml"
              echo "CSC_LINK=$keys/mac-developer-id.p12"
              echo "CSC_KEY_PASSWORD=$pass"
              echo "APPLE_API_KEY=$keys/AuthKey_Y945SS5C89.p8"
              echo "APPLE_API_KEY_ID=Y945SS5C89"
              echo "APPLE_API_ISSUER=87f439b2-db97-4066-b695-34ff182c5842"
            } >> "$GITHUB_ENV"
            echo 'Signing with the Developer ID'
          else
            echo "HULI_MAC_CONFIG=electron-builder.yml" >> "$GITHUB_ENV"
            echo 'No Developer ID here: an unsigned build'
          fi
      - run: pnpm build
      - run: node tools/install/device-helpers.mjs
      # The Mac's network drops connections now and then; a failed package is tried twice more.
      - name: Package
        run: |
          for attempt in 1 2 3; do
            pnpm exec electron-builder --mac --arm64 --publish never --config "$HULI_MAC_CONFIG" \
              ${HULI_MAC_IDENTITY:+"-c.mac.identity=$HULI_MAC_IDENTITY"} && exit 0
            echo "Packaging failed (attempt $attempt)"
            sleep 20
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Sealed before upload: the repository is public (see tools/huli/README.md).
      - name: Seal the files
        shell: bash
        env:
          HULI_ARTIFACT_KEY: ${{ secrets.HULI_ARTIFACT_KEY }}
        run: node tools/huli/seal-artifacts.mjs seal "sealed/huli-macos.sealed" 'dist/*.dmg' 'dist/*-mac.zip' 'dist/*-mac.zip.blockmap' 'dist/latest*.yml'
      - uses: actions/upload-artifact@v7
        with:
          name: huli-macos
          retention-days: 1
          # Sealed bytes do not compress.
          compression-level: 0
          path: sealed/huli-macos.sealed
          if-no-files-found: error

  cloud:
    name: Huli Cloud
    needs: version
    if: ${{ !inputs.ios_dry_run }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p cloud/tsconfig.json
      - run: pnpm exec vitest run cloud/test
      - run: pnpm exec vite build -c vite.cloud.config.mts
      # Sealed before upload: the repository is public (see tools/huli/README.md).
      - name: Seal the files
        shell: bash
        env:
          HULI_ARTIFACT_KEY: ${{ secrets.HULI_ARTIFACT_KEY }}
        run: node tools/huli/seal-artifacts.mjs seal "sealed/huli-cloud.sealed" 'cloud/dist/huli-cloud.mjs' 'cloud/deploy/install.sh'
      - uses: actions/upload-artifact@v7
        with:
          name: huli-cloud
          retention-days: 1
          # Sealed bytes do not compress.
          compression-level: 0
          path: sealed/huli-cloud.sealed
          if-no-files-found: error

  # The phone app for iOS, on a macOS runner: signed through the App Store Connect API key kept
  # there and uploaded to TestFlight for its internal testers only; no public link, which would let
  # anyone install it. Phones update through TestFlight. Only while the HULI_IOS_ADHOC variable is
  # `true` (or on a dry run) is the same archive also exported ad hoc for the team's registered
  # devices, which then install it from the update channel. Its failure never holds anything back:
  # without the ad-hoc build the release goes out as before, and the channel keeps its last one.
  ios:
    name: iOS
    needs: version
    # As the macOS build: GitHub's runner, or the owner's Mac while HULI_MAC_RUNNER is `true`.
    runs-on: ${{ vars.HULI_MAC_RUNNER == 'true' && fromJSON('["self-hosted","macOS","huli"]') || 'macos-26' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Use the newest Xcode
        if: runner.environment == 'github-hosted'
        working-directory: .
        run: bash tools/huli/newest-xcode.sh
      - name: Restore the Apple keys
        if: runner.environment == 'github-hosted'
        working-directory: .
        env:
          APPLE_KEYS: ${{ secrets.HULI_APPLE_KEYS }}
        run: bash tools/huli/restore-apple-keys.sh
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Set the version
        run: |
          node -e '
            const fs = require("fs"); const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = process.env.VERSION;
            app.expo.ios.buildNumber = process.env.RUN;
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RUN: ${{ github.run_number }}
      # The bundle takes the update channel from src/shared/updates.ts.
      - name: Fill in the update path
        working-directory: .
        run: node tools/huli/update-path.mjs
        env:
          HULI_UPDATE_PATH: ${{ secrets.HULI_UPDATE_PATH }}
      - run: CI=1 npx expo prebuild --platform ios --no-install --clean
      - name: Build, sign and upload
        run: bash ../tools/huli/ios/build-ios.sh
        env:
          APP_DIR: ${{ github.workspace }}/mobile
          HULI_TOOLS: ${{ github.workspace }}/tools/huli/ios
          OUT: ${{ runner.temp }}/ios
          ADHOC: ${{ (vars.HULI_IOS_ADHOC == 'true' || inputs.ios_dry_run) && '1' || '0' }}
          UPLOAD: ${{ inputs.ios_dry_run && '0' || '1' }}
      # The ad-hoc build goes on even when the TestFlight upload failed, once its profiles check
      # out; without it the release goes out as before. A dry run fails here instead.
      - name: Check the ad-hoc build
        id: adhoc-check
        if: ${{ !cancelled() && (vars.HULI_IOS_ADHOC == 'true' || inputs.ios_dry_run) }}
        continue-on-error: ${{ !inputs.ios_dry_run }}
        working-directory: .
        run: bash tools/huli/ios/check-ipa.sh "$RUNNER_TEMP/ios/adhoc/export/Huli.ipa"
      # Sealed before upload: the repository is public (see tools/huli/README.md).
      - name: Seal the ad-hoc build
        id: adhoc
        if: ${{ !cancelled() && !inputs.ios_dry_run && steps.adhoc-check.outcome == 'success' }}
        shell: bash
        working-directory: .
        env:
          HULI_ARTIFACT_KEY: ${{ secrets.HULI_ARTIFACT_KEY }}
          IPA: ${{ runner.temp }}/ios/adhoc/export/Huli.ipa
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          rm -rf ios-adhoc && mkdir ios-adhoc
          cp "$IPA" "ios-adhoc/Huli-$VERSION.ipa"
          node tools/huli/seal-artifacts.mjs seal sealed/huli-ios.sealed 'ios-adhoc/*.ipa'
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.adhoc.outcome == 'success' }}
        with:
          name: huli-ios
          retention-days: 1
          # Sealed bytes do not compress.
          compression-level: 0
          path: sealed/huli-ios.sealed
          if-no-files-found: error

  # The phone app for Android, signed with Huli's own key (kept off the repository) and installed
  # straight from Huli's update channel. Its failure never holds the desktop release back.
  android:
    name: Android
    needs: version
    if: ${{ !inputs.ios_dry_run }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx tsc --noEmit
      - name: Set the version
        run: |
          node -e '
            const fs = require("fs"); const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = process.env.VERSION;
            app.expo.android.versionCode = Number(process.env.RUN);
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));'
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RUN: ${{ github.run_number }}
      # The bundle takes the update channel from src/shared/updates.ts; without it the app never
      # hears of an update.
      - name: Fill in the update path
        working-directory: .
        run: node tools/huli/update-path.mjs
        env:
          HULI_UPDATE_PATH: ${{ secrets.HULI_UPDATE_PATH }}
      - run: CI=1 npx expo prebuild --platform android --no-install
      - name: Build
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=arm64-v8a
      - name: Sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          printf '%s' "$KEYSTORE" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$RUNNER_TEMP/huli.p12"
          mkdir -p out
          "$tools/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release.apk out/aligned.apk
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/huli.p12" --ks-type PKCS12 --ks-key-alias huli \
            --ks-pass env:KEYSTORE_PASSWORD --out "out/Huli-$VERSION.apk" out/aligned.apk
          rm -f "$RUNNER_TEMP/huli.p12" out/aligned.apk
          "$tools/apksigner" verify --print-certs "out/Huli-$VERSION.apk" | grep -i sha-256
      # Sealed before upload: the repository is public (see tools/huli/README.md).
      - name: Seal the files
        shell: bash
        working-directory: .
        env:
          HULI_ARTIFACT_KEY: ${{ secrets.HULI_ARTIFACT_KEY }}
        run: node tools/huli/seal-artifacts.mjs seal "sealed/huli-android.sealed" 'mobile/out/*.apk'
      - uses: actions/upload-artifact@v7
        with:
          name: huli-android
          retention-days: 1
          # Sealed bytes do not compress.
          compression-level: 0
          path: sealed/huli-android.sealed
          if-no-files-found: error

  release:
    needs: [version, desktop, mac, cloud, ios, android]
    if: >-
      always() && !inputs.ios_dry_run && needs.desktop.result == 'success' &&
      needs.cloud.result == 'success' &&
      (needs.mac.result == 'success' || needs.mac.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tools/workflow
            tools/huli/seal-artifacts.mjs
            src/main/update-keys.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: huli-*
      # Each job's files come sealed (tools/huli/seal-artifacts.mjs); each opens beside its bundle.
      - name: Open the sealed artifacts
        env:
          HULI_ARTIFACT_KEY: ${{ secrets.HULI_ARTIFACT_KEY }}
        run: |
          shopt -s nullglob
          bundles=(artifacts/*/*.sealed)
          if [ "${#bundles[@]}" = 0 ]; then
            echo '::error::No sealed artifact was downloaded.'
            exit 1
          fi
          for bundle in "${bundles[@]}"; do
            node tools/huli/seal-artifacts.mjs open "$bundle" "$(dirname "$bundle")/files"
            rm "$bundle"
          done
      - name: Gather and sign
        run: |
          mkdir release
          find artifacts -type f \( -name '*-setup.exe' -o -name '*-setup.exe.blockmap' \
            -o -name '*.AppImage' -o -name '*.dmg' -o -name '*-mac.zip' -o -name '*-mac.zip.blockmap'             -o -name 'latest*.yml' \
            -o -name 'huli-cloud.mjs' -o -name 'install.sh' -o -name '*.apk' -o -name '*.ipa' \) \
            -exec cp {} release/ \;
          node tools/workflow/sign-update-files.mjs release/latest*.yml
          # Beside release/, not in it: the sums go into the release's notes, never as a file.
          (cd release && sha256sum *) > SHA256SUMS.txt
          ls -l release
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      # The version's files first, then the update files that name it, so a check never finds a
      # version whose files are not there yet. huli-upload may only write under its folder.
      - name: Upload to Huli's update channel
        env:
          KEY: ${{ secrets.HULI_UPLOAD_KEY }}
          KNOWN_HOSTS: ${{ secrets.HULI_UPLOAD_KNOWN_HOSTS }}
          VERSION: ${{ needs.version.outputs.version }}
          RUN: ${{ github.run_number }}
          # A secret, which the log masks: it holds the channel's path.
          CHANNEL: ${{ secrets.HULI_CHANNEL_URL }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$KEY" > ~/.ssh/huli_upload)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh="ssh -i $HOME/.ssh/huli_upload -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          host=huli-upload@132.145.200.0
          mkdir channel
          cp release/*-setup.exe* release/*.AppImage release/*.dmg release/*-mac.zip* release/latest*.yml* channel/ 2>/dev/null || true
          rsync -rt --mkpath --chmod=D755,F644 -e "$ssh" channel/ "$host:download/v$VERSION/"
          rsync -rt --mkpath --chmod=D755,F644 -e "$ssh" release/latest*.yml "$host:latest/download/"
          # The phone's download link stays the same from version to version.
          # latest.json goes last, so the app never hears of an APK that is not there yet.
          for apk in release/*.apk; do
            [ -e "$apk" ] || continue
            rsync -t --mkpath --chmod=F644 -e "$ssh" "$apk" "$host:download/v$VERSION/"
            rsync -t --mkpath --chmod=F644 -e "$ssh" "$apk" "$host:android/Huli.apk"
            printf '{"version":"%s","versionCode":%s,"url":"%s/android/Huli.apk","size":%s,"sha256":"%s"}\n' \
              "$VERSION" "$RUN" "$CHANNEL" "$(stat -c %s "$apk")" "$(sha256sum "$apk" | cut -d' ' -f1)" \
              > latest-android.json
            rsync -t --mkpath --chmod=F644 -e "$ssh" latest-android.json "$host:android/latest.json"
          done
          # The iOS build for the registered devices, installed through an itms-services link to its
          # manifest. The IPA and its manifest stay in the version's folder; ios/ holds a copy of the
          # newest manifest, a link that stays the same for a first install, and latest.json last.
          for ipa in release/*.ipa; do
            [ -e "$ipa" ] || continue
            name="$(basename "$ipa")"
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict><key>items</key><array><dict>' \
              "<key>assets</key><array><dict><key>kind</key><string>software-package</string><key>url</key><string>$CHANNEL/download/v$VERSION/$name</string></dict></array>" \
              "<key>metadata</key><dict><key>bundle-identifier</key><string>io.github.rsdvb.huli</string><key>bundle-version</key><string>$VERSION</string><key>kind</key><string>software</string><key>title</key><string>纸鸢</string></dict>" \
              '</dict></array></dict></plist>' > manifest.plist
            rsync -t --mkpath --chmod=F644 -e "$ssh" "$ipa" manifest.plist "$host:download/v$VERSION/"
            rsync -t --mkpath --chmod=F644 -e "$ssh" manifest.plist "$host:ios/"
            printf '{"version":"%s","build":%s,"manifest":"%s/download/v%s/manifest.plist"}\n' \
              "$VERSION" "$RUN" "$CHANNEL" "$VERSION" > latest-ios.json
            rsync -t --mkpath --chmod=F644 -e "$ssh" latest-ios.json "$host:ios/latest.json"
          done
          rm -f ~/.ssh/huli_upload
      # Notes and a tag only, never the files: the repository is public and the builds are not.
      # The tag stays, since the changes job compares main with the latest release's.
      - name: Publish a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "Kettu $(git ls-remote https://github.com/KettuAI/Kettu.git refs/heads/main | cut -c1-8) 合并后的自动编译。安装包只在更新渠道上。"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "v$VERSION" --prerelease --target "$GITHUB_SHA" \
            --title "Kite $VERSION" --notes-file notes.md

  # Deletes every artifact of this run once the jobs that upload and download them are done, even
  # when one failed, so the public repository never offers a build for download.
  cleanup:
    name: Delete the artifacts
    needs: [changes, desktop, mac, cloud, ios, android, release]
    if: always() && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[].id')"
          for id in $ids; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
          echo "Deleted $(printf '%s\n' $ids | grep -c .) artifacts"
